<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VACRE PET</title><style>
*{box-sizing:border-box}.pet-wrap{color:#292719;font:16px system-ui,Arial}.pet-wrap{max-width:1050px;margin:20px auto;padding:20px}.pet-head{background:#ead584;border:3px solid #292719;border-radius:24px;padding:25px;box-shadow:7px 7px #292719}.pet-head h1{font-size:clamp(35px,5vw,60px);margin:0}.pet-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-top:24px}.pet-panel{background:#fff;border:2px solid #28281d;border-radius:22px;padding:20px;box-shadow:5px 5px #d4cba9}.pet-stage{height:315px;display:grid;place-items:center;background:radial-gradient(ellipse,#fff8d9 30%,#e9f0e5);border-radius:18px;position:relative;overflow:hidden}.pet-creature{width:180px;height:170px;position:relative;background:var(--skin,#f6c453);border:5px solid #292719;display:grid;place-items:center;filter:drop-shadow(0px 12px 0 #0002);animation:pet-bob 2.8s ease-in-out infinite}.pet-creature[data-shape=rond]{border-radius:50%}.pet-creature[data-shape=ovale]{border-radius:50%;width:145px;height:190px}.pet-creature[data-shape=carre]{width:175px;height:175px;border-radius:12px}.pet-creature[data-shape=rectangle]{width:210px;height:140px;border-radius:12px}.pet-creature[data-shape=triangle]{clip-path:polygon(50% 0,100% 100%,0 100%);border:0;padding-top:65px}.pet-creature[data-shape=losange]{transform:rotate(45deg);width:150px;height:150px}.pet-creature[data-shape=losange] .pet-face{transform:rotate(-45deg)}.pet-face{text-align:center;font-size:38px;line-height:1.2;z-index:1}.pet-hair{font-size:30px;height:35px}.pet-mouth{font-size:28px}.pet-accessory{position:absolute;top:-33px;left:50%;transform:translateX(-50%);font-size:43px;z-index:3}.pet-chat{position:absolute;bottom:12px;background:white;border:2px solid #292719;border-radius:12px;padding:8px 12px;max-width:92%;font-weight:700}.pet-egg{font-size:130px;animation:pet-wobble 2.5s infinite}.pet-stats{display:grid;gap:12px}.pet-stat-label{display:flex;justify-content:space-between;font-size:14px;font-weight:800}.pet-meter{height:13px;background:#ebe5d1;border-radius:30px;overflow:hidden}.pet-meter>span{height:100%;display:block;background:#84b77e;transition:width .4s}.pet-wrap button,.pet-wrap select,.pet-wrap input{font:inherit}.pet-wrap button{background:#ead584;border:2px solid #292719;border-radius:11px;padding:11px 14px;cursor:pointer;font-weight:800}.pet-wrap button:hover{background:#f6df85}.pet-wrap button:disabled{opacity:.5;cursor:not-allowed}.pet-actions,.pet-shop,.pet-custom{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pet-custom label{font-size:13px;font-weight:800}.pet-custom input,.pet-custom select{width:100%;padding:9px;border:2px solid #ccc2a7;border-radius:9px;background:white;margin-top:5px}.pet-actions button{min-height:49px}.pet-shop button{background:#f0efe8;text-align:left}.pet-muted{color:#656052;font-size:14px}.pet-alert{padding:12px;background:#fff0cd;border-radius:12px;margin:10px 0}.pet-error{color:#ad2929}.pet-hide{display:none!important}@keyframes pet-bob{0%,100%{translate:0 0}50%{translate:0 -11px}}@keyframes pet-wobble{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}@media(max-width:760px){.pet-grid{grid-template-columns:1fr}.pet-wrap{padding:12px}.pet-custom{grid-template-columns:1fr 1fr}}
</style></head><body><main class="pet-wrap" id="pet-app"><header class="pet-head"><h1>🥚 VACRE PET</h1><p>Un compagnon unique, une histoire qui grandit avec toi.</p></header><p id="pet-message" class="pet-alert" role="status">Connecte-toi à ton compte VACRE.</p><section id="pet-adopt" class="pet-panel pet-hide"><h2>Adopte ton Vacre</h2><p>Ton œuf éclora dans 10 minutes. Personnalise déjà ton futur compagnon !</p><div class="pet-custom" id="pet-form"><label>Nom<input id="pet-name" maxlength="24" placeholder="Nom du Vacre" required></label><label>Forme<select id="pet-shape"><option value="rond">Ronde</option><option value="ovale">Ovale</option><option value="carre">Carrée</option><option value="rectangle">Rectangulaire</option><option value="triangle">Triangulaire</option><option value="losange">Losange</option></select></label><label>Couleur<select id="pet-color"><option value="#f6c453">Jaune</option><option value="#a8d5ff">Bleu</option><option value="#ffabb8">Rose</option><option value="#b7edbb">Vert</option><option value="#c5b5ff">Violet</option><option value="#ffa96b">Orange</option></select></label><label>Yeux<select id="pet-eyes"><option value="ronds">Ronds</option><option value="endormis">Endormis</option><option value="joyeux">Joyeux</option><option value="etoiles">Étoilés</option></select></label><label>Moustache<select id="pet-mustache"><option value="aucune">Aucune</option><option value="fine">Fine</option><option value="bouclee">Bouclée</option></select></label><label>Barbe<select id="pet-beard"><option value="aucune">Aucune</option><option value="bouc">Bouc</option><option value="courte">Courte</option></select></label><label>Cheveux<select id="pet-hair"><option value="aucun">Aucun</option><option value="houppette">Houppette</option><option value="boucle">Bouclés</option><option value="epi">En épi</option></select></label></div><p><button id="pet-adopt-button">🥚 Obtenir mon œuf gratuitement</button></p></section><div class="pet-grid" id="pet-game"><section class="pet-panel"><h2 id="pet-title">Ton compagnon</h2><div class="pet-stage" id="pet-stage"><div class="pet-egg">🥚</div></div><p id="pet-meta" class="pet-muted"></p><p id="pet-event" class="pet-alert"></p><div class="pet-actions" id="pet-actions"><button data-pet-action="feed">🍎 Nourrir</button><button data-pet-action="sleep">💤 Reposer</button><button data-pet-action="wash">🛁 Laver</button><button data-pet-action="play">🎾 Jouer</button><button data-pet-action="cuddle">💗 Câliner</button><button data-pet-action="heal">🩺 Soigner (gratuit)</button></div><p><button id="pet-abandon">Abandonner définitivement</button></p></section><div><section class="pet-panel"><h2>État du Vacre</h2><p id="pet-level"></p><div id="pet-stats" class="pet-stats"></div><p id="pet-disease" class="pet-alert"></p></section><section class="pet-panel" style="margin-top:20px"><h2>🛍 Boutique</h2><p class="pet-muted">Accessoires achetés avec tes urabucks.</p><div class="pet-shop" id="pet-shop"></div></section></div></div></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),client=()=>window.supabaseClient;let pet=null,busy=false;const products=[['casquette','🧢',1200],['echarpe','🧣',1500],['gants','🧤',1700],['lunettes','🕶️',2200],['bonnet','🎿',1400]];const actions={feed:'Tu as nourri ton Vacre !',sleep:'Une bonne sieste !',wash:'Tout propre !',play:'Il a adoré jouer !',cuddle:'Il se sent aimé !',heal:'Il est guéri !'};const status=(s,bad=false)=>{$('pet-message').textContent=s;$('pet-message').classList.toggle('pet-error',bad)};
async function rpc(a,data={}){if(!client())throw Error('Supabase indisponible. Ouvre le jeu depuis VACRE.FR.');const {data:result,error}=await client().rpc('vacre_pet_action',{p_action:a,p_data:data});if(error)throw error;pet=result;render();return result}
async function start(){if(!client())return status('Ouvre VACRE PET depuis le site VACRE.FR.',true);const {data:{user},error}=await client().auth.getUser();if(error||!user){$('pet-adopt').classList.add('pet-hide');$('pet-game').classList.add('pet-hide');return status('Connecte-toi pour adopter ton Vacre.')}try{const {data,error:err}=await client().from('vacre_pet').select('*').eq('user_id',user.id).maybeSingle();if(err)throw err;pet=data;if(pet)await rpc('sync');else render();status('Prêt à jouer !')}catch(e){status('Erreur : '+e.message,true)}}
function creature(){const eyes={ronds:'● ●',endormis:'⌣ ⌣',joyeux:'＾ ＾',etoiles:'★ ★'};const hair={aucun:'',houppette:'〰',boucle:'➰',epi:'⚡'};const mustache={aucune:'',fine:'﹏',bouclee:'〰'};const beard={aucune:'',bouc:'▽',courte:'▾'};const cap=pet.equipped?.includes('casquette')?'🧢':pet.equipped?.includes('bonnet')?'🧶':'';return `<div class="pet-creature" data-shape="${pet.shape}" style="--skin:${pet.color}"><div class="pet-accessory">${cap}</div><div class="pet-face"><div class="pet-hair">${hair[pet.hair]||''}</div><div>${eyes[pet.eyes]||'● ●'}</div><div class="pet-mouth">${mustache[pet.mustache]||''}ᴗ${beard[pet.beard]||''}</div>${pet.equipped?.includes('lunettes')?'🕶️':''}${pet.equipped?.includes('echarpe')?'🧣':''}${pet.equipped?.includes('gants')?'🧤':''}</div></div>`}
function render(){const adopted=Boolean(pet);$('pet-adopt').classList.toggle('pet-hide',adopted);$('pet-game').classList.toggle('pet-hide',!adopted);if(!adopted)return;$('pet-title').textContent=pet.name;$('pet-level').textContent=`Niveau ${pet.level}/50 · ${pet.xp} XP / ${pet.level===50?'MAX':50+pet.level*25+' XP'}`;const t=Math.max(0,Math.ceil((Date.parse(pet.hatch_at)-Date.now())/1000));$('pet-stage').innerHTML=pet.stage==='egg'?`<div class="pet-egg">🥚</div><div class="pet-chat">Éclosion dans ${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</div>`:pet.stage==='alive'?creature()+`<div class="pet-chat">${pet.disease?'Je ne me sens pas très bien...':pet.fun<30?'Je m’ennuie...':'Coucou !'}</div>`:`<div class="pet-chat">${pet.stage==='dead'?'Ton compagnon est décédé.':'Vous avez abandonné '+pet.name}</div>`;$('pet-meta').textContent=pet.stage==='alive'?`${pet.temperament} · Né le ${new Date(pet.hatch_at).toLocaleDateString('fr-FR')}`:pet.stage==='egg'?'Patience, ton œuf grandit.':'';$('pet-event').textContent=pet.event_message||'Les aventures commencent bientôt.';$('pet-disease').textContent=pet.disease?`⚠️ ${pet.disease} — soin gratuit à effectuer dans les 24 h.`:'🟢 Aucun problème de santé.';const needs=[['hunger','Faim'],['energy','Énergie'],['hygiene','Hygiène'],['fun','Amusement'],['affection','Affection']];$('pet-stats').innerHTML=needs.map(([key,title])=>`<div><div class="pet-stat-label"><span>${title}</span><span>${pet[key]}/100</span></div><div class="pet-meter"><span style="width:${pet[key]}%;background:${pet[key]<25?'#e28b7f':'#84b77e'}"></span></div></div>`).join('');document.querySelectorAll('[data-pet-action]').forEach(b=>b.disabled=busy||pet.stage!=='alive');$('pet-abandon').disabled=busy||pet.stage!=='alive';$('pet-shop').innerHTML=products.map(([key,emoji,price])=>{const owned=pet.owned?.includes(key),equipped=pet.equipped?.includes(key);return `<button data-item="${key}" ${busy||pet.stage!=='alive'?'disabled':''}>${emoji} ${key}<br><small>${owned?(equipped?'Retirer':'Équiper'):price.toLocaleString('fr-FR')+' urabucks'}</small></button>`}).join('')}
$('pet-adopt-button').onclick=async()=>{if(busy)return;busy=true;try{const data={name:$('pet-name').value.trim(),shape:$('pet-shape').value,color:$('pet-color').value,eyes:$('pet-eyes').value,mustache:$('pet-mustache').value,beard:$('pet-beard').value,hair:$('pet-hair').value};await rpc('adopt',data);status('Ton œuf a été adopté ! Rendez-vous dans 10 minutes.')}catch(e){status(e.message,true)}finally{busy=false;render()}};
$('pet-actions').onclick=async e=>{const action=e.target.closest('button')?.dataset.petAction;if(!action||busy)return;busy=true;try{await rpc(action);status(actions[action])}catch(e){status(e.message,true)}finally{busy=false;render()}};
$('pet-shop').onclick=async e=>{const item=e.target.closest('button')?.dataset.item;if(!item||busy)return;busy=true;try{await rpc(pet.owned?.includes(item)?'equip':'buy',{item});status('Boutique mise à jour !')}catch(e){status(e.message,true)}finally{busy=false;render()}};
$('pet-abandon').onclick=async()=>{if(!pet||!confirm('Abandon définitif : tu ne pourras plus récupérer ce compagnon. Confirmer ?'))return;try{await rpc('abandon');status('Vous avez abandonné '+pet.name)}catch(e){status(e.message,true)}};
let lastSync=0;async function tick(){if(!pet)return;if(pet.stage==='egg'||pet.stage==='alive'){if(Date.now()-lastSync>60000){lastSync=Date.now();try{await rpc('sync')}catch(e){status(e.message,true)}}else render()}};
window.vacrePetStart=start;window.vacrePetRefresh=start;setInterval(()=>{if(!document.getElementById('v2-drawer')||document.body.dataset.v2Page==='chantier')tick()},1000);if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start);else start();})();
</script></body></html>

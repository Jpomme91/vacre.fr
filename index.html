<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffd400">
  <title>VACRE — Maintenance</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --yellow: #ffd400;
      --black: #0a0a0a;
      --white: #fff;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: var(--yellow);
      color: var(--black);
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", Arial, sans-serif;
      overflow-x: hidden;
    }

    .hazard {
      width: 100%;
      height: 52px;
      background:
        repeating-linear-gradient(
          -45deg,
          var(--black) 0,
          var(--black) 34px,
          var(--yellow) 34px,
          var(--yellow) 68px
        );
      border-bottom: 5px solid var(--black);
    }

    .hazard.bottom {
      border-top: 5px solid var(--black);
      border-bottom: 0;
    }

    main {
      min-height: calc(100vh - 104px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 55px 20px;
      position: relative;
    }

    .panel {
      width: min(900px, 100%);
      background: var(--yellow);
      border: 7px solid var(--black);
      box-shadow: 14px 14px 0 var(--black);
      padding: clamp(28px, 6vw, 65px);
      text-align: center;
      position: relative;
    }

    .badge {
      display: inline-block;
      background: var(--black);
      color: var(--yellow);
      border: 4px solid var(--black);
      padding: 9px 16px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .icon {
      font-size: clamp(55px, 10vw, 95px);
      line-height: 1;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(48px, 10vw, 105px);
      line-height: .83;
      text-transform: uppercase;
      letter-spacing: -2px;
      margin-bottom: 32px;
    }

    .message {
      max-width: 720px;
      margin: 0 auto;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(17px, 2.5vw, 22px);
      line-height: 1.55;
      font-weight: 800;
    }

    .motto {
      margin: 30px auto 0;
      max-width: 700px;
      padding: 20px;
      background: var(--black);
      color: var(--yellow);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(17px, 2.5vw, 21px);
      line-height: 1.4;
      font-weight: 900;
      text-transform: uppercase;
      border: 4px solid var(--black);
    }

    .team {
      margin-top: 25px;
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .eta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 35px;
      padding: 14px 20px;
      background: var(--white);
      border: 4px solid var(--black);
      box-shadow: 6px 6px 0 var(--black);
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(16px, 3vw, 20px);
      font-weight: 900;
      text-transform: uppercase;
    }

    .corner {
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--black);
    }

    .c1 { top: 14px; left: 14px; }
    .c2 { top: 14px; right: 14px; }
    .c3 { bottom: 14px; left: 14px; }
    .c4 { bottom: 14px; right: 14px; }

    @media (max-width: 600px) {
      .hazard {
        height: 38px;
        background:
          repeating-linear-gradient(
            -45deg,
            var(--black) 0,
            var(--black) 24px,
            var(--yellow) 24px,
            var(--yellow) 48px
          );
      }

      main {
        min-height: calc(100vh - 76px);
        padding: 30px 15px;
      }

      .panel {
        border-width: 5px;
        box-shadow: 8px 8px 0 var(--black);
      }

      .corner {
        width: 18px;
        height: 18px;
      }

      .c1 { top: 9px; left: 9px; }
      .c2 { top: 9px; right: 9px; }
      .c3 { bottom: 9px; left: 9px; }
      .c4 { bottom: 9px; right: 9px; }
    }
  </style>
</head>

<body>
  <div class="hazard"></div>

  <main>
    <section class="panel">
      <span class="corner c1"></span>
      <span class="corner c2"></span>
      <span class="corner c3"></span>
      <span class="corner c4"></span>

      <div class="badge">Zone en construction</div>

      <div class="icon" aria-hidden="true">⚠</div>

      <h1>V A C R E . F R<br>E N  M A I N T E N A N C E</h1>

      <p class="message">
        Nous savons que vous tenez beaucoup à vos Vacres,
        mais le site reviendra plus neuf que jamais.
      </p>

      <div class="motto">
        N’oubliez jamais : trouvez le Vacre,<br>
        et le Vacre viendra à vous.
      </div>

      <p class="team">— L’équipe de vacre.fr</p>

      <div class="eta">
        ⏱ Attente estimée : ~18 h
      </div>
    </section>
  </main>

  <div class="hazard bottom"></div>
</body>
</html>
